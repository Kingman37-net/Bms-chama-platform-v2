<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Login | BODMAS CHAMAA</title>
  <meta name="description" content="Login to the BODMAS CHAMAA member portal.">
  <link rel="stylesheet" href="assets/css/member.css">
</head>
<body class="member-body is-login">

  <div class="member-login-box">
    <h1>Member Login</h1>
    <p class="sub">BODMAS CHAMAA Portal</p>

    <form id="memberLoginForm" autocomplete="off" novalidate>
      <label for="memberId">Member ID or Email</label>
      <input type="text" id="memberId" name="memberId" placeholder="e.g. BMS-0001" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required>

      <button type="submit">Login</button>
    </form>

    <div id="debug" style="margin-top:12px;padding:8px;background:#fee;color:#900;border-radius:6px;font-size:12px;display:none;word-break:break-all"></div>

    <a href="../docs/index.html" class="back-link">&larr; Back to BODMAS CHAMAA</a>
  </div>

  <script>
    // Debug: show any JS errors on the page
    window.addEventListener('error', function (e) {
      var d = document.getElementById('debug');
      d.style.display = 'block';
      d.textContent = 'JS Error: ' + e.message + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno;
    });
    // Failsafe: if member.js?v=5
    document.addEventListener('DOMContentLoaded', function () {
      var form = document.getElementById('memberLoginForm');
      if (form && typeof window.__bmcAttached === 'undefined') {
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          alert('member.js?v=5
        });
      }
    });
  </script>

  <script src="assets/js/member.js?v=5" defer></script>
</body>
</html>
