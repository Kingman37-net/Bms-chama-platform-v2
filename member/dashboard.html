<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | BODMAS Member</title>
</head>
<body class="member-body">

  <main class="member-main">
    <div class="member-page-header">
      <h1>Welcome back</h1>
      <p>Here is your financial snapshot at a glance.</p>
    </div>

    <div class="member-stats">
      <div class="member-stat">
        <span class="label">Total Savings</span>
        <span class="value" data-stat="savings">—</span>
      </div>
      <div class="member-stat orange">
        <span class="label">Loan Balance</span>
        <span class="value" data-stat="loan">—</span>
      </div>
      <div class="member-stat green">
        <span class="label">This Month</span>
        <span class="value">—</span>
      </div>
      <div class="member-stat red">
        <span class="label">Outstanding</span>
        <span class="value">—</span>
      </div>
    </div>

    <div class="member-actions">
      <a class="member-action" href="contributions.html">Contributions</a>
      <a class="member-action" href="loans.html">My Loans</a>
      <a class="member-action" href="statements.html">Statements</a>
      <a class="member-action" href="notifications.html">Notifications</a>
    </div>

    <div class="member-card">
      <h2>Recent Activity</h2>
      <div data-activity>
        <p>Loading...</p>
      </div>
    </div>

    <div class="member-card">
      <h2>Group Announcements</h2>
      <p>Meeting schedules and resolutions from the committee will be published here.</p>
    </div>
  </main>

</body>
</html>
